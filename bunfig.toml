# Bun configuration for the clinic-app workspace.

[install]
linker = "isolated"
saveTextLockfile = true
exact = true
linkWorkspacePackages = true
production = false
optional = true
peer = true

[install.cache]
disable = false
disableManifest = false

[test]
coverage = true
coverageThreshold = 0.9
root = "./"
coveragePathIgnorePatterns = [
  "**/src-tauri/**",
  "**/migrations/**",
  "**/node_modules/**",
  "**/.turbo/**",
  "**/dist/**",
  "**/.next/**",
]

coverageReporter = ["text", "lcov"]
coverageSkipTestFiles = true

[run]
bun = true
shell = "system"
sourcemap = false

jsx = "react-jsx"
jsxImportSource = "react"
